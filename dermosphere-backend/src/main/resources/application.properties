server.port=8081

# MySQL Database Target Settings
spring.datasource.url=jdbc:mysql://localhost:3306/dermosphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Thrishankdev123

# --- MAXIMIZATION: HikariCP Connection Pooling ---
# Keeps 20 database connections permanently open in RAM to eliminate handshake latency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --- MAXIMIZATION: Spring Boot Actuator ---
# Exposes /actuator/metrics for live UI dashboards or Grafana mapping
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

ai.microservice.url=http://127.0.0.1:8000/api/v1/triage/predict
spring.servlet.multipart.max-file-size=10MB