<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DermoSphere - Disconnected</title>
    <link rel="stylesheet" href="css/master.css">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        
        .logout-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Cinematic Screen Collapse Animation */
        .screen-collapse {
            position: fixed;
            inset: 0;
            background: var(--clr-space-dark);
            z-index: 100;
            animation: crt-off 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            pointer-events: none;
        }

        @keyframes crt-off {
            0% { transform: scale(1, 1); opacity: 1; }
            40% { transform: scale(1, 0.005); opacity: 1; }
            70% { transform: scale(0.005, 0.005); opacity: 1; }
            100% { transform: scale(0, 0); opacity: 0; }
        }

        .data-purge-text {
            font-family: 'Courier New', monospace;
            color: var(--clr-danger);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--clr-danger);
            animation: typing 1.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--clr-danger); } }
    </style>
</head>
<body>
    <div class="screen-collapse"></div>
    
    <div class="logout-wrapper">
        <svg viewBox="0 0 100 100" style="width: 80px; height: 80px; margin-bottom: 2rem;">
            <circle cx="50" cy="50" r="40" stroke="var(--clr-danger)" stroke-width="4" fill="none" stroke-dasharray="250" stroke-dashoffset="0">
                <animate attributeName="stroke-dashoffset" from="0" to="250" dur="2s" fill="freeze"/>
            </circle>
            <path d="M35,35 L65,65 M65,35 L35,65" stroke="var(--clr-danger)" stroke-width="6" stroke-linecap="round">
                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
            </path>
        </svg>
        
        <div class="data-purge-text" id="purgeText">EXECUTING CRYPTOGRAPHIC PURGE...</div>
    </div>

    <script>
        sessionStorage.clear();
        localStorage.clear();
        
        const texts = [
            "EXECUTING CRYPTOGRAPHIC PURGE...",
            "WIPING SESSION TOKENS...",
            "SEVERING WEBSOCKET PROTOCOLS...",
            "SYSTEM OFFLINE."
        ];
        
        let idx = 0;
        const textEl = document.getElementById('purgeText');
        
        const interval = setInterval(() => {
            idx++;
            if (idx >= texts.length) {
                clearInterval(interval);
                setTimeout(() => window.location.replace('index.html'), 1500);
            } else {
                textEl.textContent = texts[idx];
            }
        }, 800);
    </script>
</body>
</html>
